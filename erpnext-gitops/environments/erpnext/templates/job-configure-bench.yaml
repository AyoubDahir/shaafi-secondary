{{- if .Values.jobs.configure.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "erpnext.fullname" . }}-conf-bench-{{ now | date "20060102150405" }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.jobs.configure.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "erpnext.serviceAccountName" $ }}
      {{- if .Values.jobs.configure.fixVolume }}
      initContainers:
        - name: frappe-bench-ownership
          image: {{ include "erpnext.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >
              chown -R "{{ default 1000 .Values.securityContext.runAsUser }}:{{ default 1000 .Values.securityContext.runAsUser }}"
              /home/frappe/frappe-bench/sites
              /home/frappe/frappe-bench/logs
          resources:
            {{- toYaml .Values.jobs.configure.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: configure
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          {{- if .Values.jobs.configure.command }}
            {{- toYaml .Values.jobs.configure.command | nindent 12 }}
          {{- else }}
            - bash
            - -c
          {{- end }}
          args:
          {{- if .Values.jobs.configure.args }}
            {{- toYaml .Values.jobs.configure.args | nindent 12 }}
          {{- else }}
            - |
              set -euo pipefail

              echo "========================================"
              echo "ERPNext configure job starting..."
              echo "========================================"

              SITE_NAME="{{ .Values.jobs.installApp.siteName }}"
              SITE_DIR="sites/$SITE_NAME"
              OLD_SITE_DIR="sites/38.247.137.8.nip.io"

              echo "Building apps.txt from apps in image..."
              mkdir -p sites
              ls -1 apps > sites/apps.txt
              echo "Apps found:"
              cat sites/apps.txt || true

              echo "{}" > sites/common_site_config.json

              echo "Setting common site config..."
              bench set-config -gp db_port "$DB_PORT"
              bench set-config -g db_host "$DB_HOST"
              {{ if .Values.dbRds }}
              bench set-config -gp rds_db 1
              {{ end }}
              bench set-config -g redis_cache "$REDIS_CACHE"
              bench set-config -g redis_queue "$REDIS_QUEUE"
              bench set-config -g redis_socketio "$REDIS_SOCKETIO"
              bench set-config -gp socketio_port "$SOCKETIO_PORT"

              echo "Checking site directory..."
              if [ ! -d "$SITE_DIR" ] && [ -d "$OLD_SITE_DIR" ]; then
                echo "Renaming site: 38.247.137.8.nip.io -> $SITE_NAME"
                mv "$OLD_SITE_DIR" "$SITE_DIR"
                echo "$SITE_NAME" > sites/currentsite.txt
                echo "Site renamed successfully"
              elif [ -d "$SITE_DIR" ]; then
                echo "Site directory $SITE_DIR already exists"
                echo "$SITE_NAME" > sites/currentsite.txt
              else
                echo "WARN: Neither old nor new site directory found"
              fi

              echo "========================================"
              echo "GitOps mode: no runtime source patching"
              echo "========================================"
              echo "Skipping runtime edits to app code in /apps."

              echo "========================================"
              echo "Installing apps..."
              echo "========================================"
              {{ if .Values.jobs.installApp.apps }}
              {{ range .Values.jobs.installApp.apps }}
              echo "Installing app: {{ . }}"
              if bench --site "{{ $.Values.jobs.installApp.siteName }}" list-apps | grep -qx "{{ . }}"; then
                echo "  -> {{ . }} already installed, skipping"
              else
                if bench --site "{{ $.Values.jobs.installApp.siteName }}" install-app "{{ . }}" --force; then
                  echo "  -> {{ . }} installed successfully"
                else
                  if bench --site "{{ $.Values.jobs.installApp.siteName }}" list-apps | grep -qx "{{ . }}"; then
                    echo "  WARN: install-app {{ . }} returned non-zero, but app is already installed; continuing"
                  else
                    echo "  WARN: install-app {{ . }} failed and app is still missing; continuing"
                  fi
                fi
              fi
              {{ end }}
              {{ end }}

              if [ -d "$SITE_DIR" ]; then
                echo "Clearing cache..."
                bench --site "$SITE_NAME" clear-cache || true

                echo "Running migrate..."
                bench --site "$SITE_NAME" migrate --skip-failing || true

                echo "Syncing prime custom fields (ensures all custom/ JSON fields exist in DB)..."
                /home/frappe/frappe-bench/env/bin/python3 - <<'SYNCEOF' || echo "WARN: sync_customizations returned non-zero"
              import frappe
              frappe.init(site='{{ .Values.jobs.configure.companySetup.siteName }}', sites_path='/home/frappe/frappe-bench/sites')
              frappe.connect()
              try:
                  from frappe.modules.utils import sync_customizations
                  sync_customizations('prime')
                  frappe.db.commit()
                  print("prime custom fields synced OK")
              except Exception as e:
                  print("WARN sync_customizations: " + str(e))
              frappe.destroy()
              SYNCEOF

                {{- if .Values.jobs.configure.companySetup.enabled }}
                echo "========================================"
                echo "Company setup check (idempotent)..."
                echo "========================================"
                /home/frappe/frappe-bench/env/bin/python3 - <<'PYEOF' || echo "WARN: company setup returned non-zero"
              import sys, importlib
              import frappe
              site = '{{ .Values.jobs.configure.companySetup.siteName }}'
              company_name = '{{ .Values.jobs.configure.companySetup.companyName }}'
              frappe.init(site=site, sites_path='/home/frappe/frappe-bench/sites')
              frappe.connect()
              if frappe.db.exists("Company", company_name):
                  print("Company already exists - skipping setup wizard")
                  frappe.destroy()
                  sys.exit(0)
              print("No company found - running ERPNext setup wizard...")
              from frappe.desk.page.setup_wizard.setup_wizard import setup_complete
              setup_complete({
                  "language": "English",
                  "country": "{{ .Values.jobs.configure.companySetup.country }}",
                  "timezone": "{{ .Values.jobs.configure.companySetup.timezone }}",
                  "currency": "{{ .Values.jobs.configure.companySetup.currency }}",
                  "full_name": "Administrator",
                  "email": "{{ .Values.jobs.configure.companySetup.adminEmail }}",
                  "password": "{{ .Values.jobs.configure.companySetup.adminPassword }}",
                  "company_name": "{{ .Values.jobs.configure.companySetup.companyName }}",
                  "company_abbr": "{{ .Values.jobs.configure.companySetup.companyAbbr }}",
                  "company_tagline": "",
                  "bank_account": "Main Bank Account"
              })
              print("Setup wizard done")
              frappe.db.commit()
              print("Running prime after_install...")
              try:
                  import prime.setup.install as pi
                  importlib.reload(pi)
                  pi.after_install()
                  frappe.db.commit()
                  print("prime after_install done")
              except Exception as e:
                  print("WARN: prime after_install error: " + str(e))
              frappe.destroy()
              print("Company setup complete!")
              PYEOF
                {{- end }}

                echo "Syncing prime fixtures (workspaces, MoP, sales types)..."
                bench --site "$SITE_NAME" sync-fixtures --app prime || echo "WARN: sync-fixtures returned non-zero"

                echo "Seeding Home Page records..."
                bench --site "$SITE_NAME" execute mma_design.install.seed_home_pages || echo "WARN: seed_home_pages returned non-zero"
              else
                echo "WARN: Site directory missing, skipping cache/migrate/seed"
              fi

              echo "========================================"
              echo "common_site_config.json managed via bench set-config"
              echo "========================================"

              echo "========================================"
              echo "Setting up assets..."
              echo "========================================"

              mkdir -p sites/assets
              BUILT=/home/frappe/frappe-bench/.built-assets

              if [ -d "$BUILT" ]; then
                if [ -s "$BUILT/assets.json" ] && ! grep -Eq '^[[:space:]]*\{[[:space:]]*\}[[:space:]]*$' "$BUILT/assets.json"; then
                  echo "Merging built assets from image (non-destructive)"
                  cp -rf "$BUILT"/. sites/assets/ || true
                else
                  echo "WARN: .built-assets/assets.json missing/empty; skipping destructive image asset copy"
                fi
              else
                echo "WARN: .built-assets not found"
              fi

              # Ensure static assets from apps public/ are present on PVC.
              for app in frappe erpnext healthcare hrms payments mma_design prime; do
                SRC="/home/frappe/frappe-bench/apps/$app/$app/public"
                DST="sites/assets/$app"
                if [ -d "$SRC" ]; then
                  mkdir -p "$DST"
                  cp -rf "$SRC"/. "$DST"/ || true
                fi
              done
              # bench build may recreate top-level app symlinks under sites/assets.
              # Replace them with real directories/files on the shared PVC.
              find sites/assets -maxdepth 1 -type l -delete 2>/dev/null || true
              for app in frappe erpnext healthcare hrms payments mma_design prime; do
                SRC="/home/frappe/frappe-bench/apps/$app/$app/public"
                DST="sites/assets/$app"
                if [ -d "$SRC" ]; then
                  mkdir -p "$DST"
                  cp -rLf "$SRC"/. "$DST"/ || true
                fi
              done

              # Materialize any symlinked assets (created by bench build) into real PVC files.
              TMP_ASSETS=/tmp/materialized-assets
              rm -rf "$TMP_ASSETS"
              mkdir -p "$TMP_ASSETS"
              cp -rL sites/assets/. "$TMP_ASSETS"/ 2>/dev/null || true
              find sites/assets -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -rf "$TMP_ASSETS"/. sites/assets/ || true

              if [ ! -s sites/assets/assets.json ] || ! /home/frappe/frappe-bench/env/bin/python3 -c "import json,os,sys; d=json.load(open('sites/assets/assets.json')); req=('app.bundle.js','app.bundle.css','libs.bundle.js','desk.bundle.js','list.bundle.js','form.bundle.js','controls.bundle.js','report.bundle.js','erpnext.bundle.css','hrms.bundle.css'); ok=isinstance(d,dict) and all(k in d for k in req) and all(isinstance(v,str) and v.startswith('/assets/') and os.path.exists('/home/frappe/frappe-bench/sites/'+v.lstrip('/')) for v in d.values()); sys.exit(0 if ok else 1)" 2>/dev/null; then
                echo "assets.json missing/empty; trying runtime build fallback..."
                # Ensure bench build writes into the PVC-backed assets path.
                rm -rf assets
                ln -s "$(pwd)/sites/assets" assets
                export NVM_DIR=/home/frappe/.nvm
                for node_bin in /home/frappe/.nvm/versions/node/*/bin; do
                  [ -d "$node_bin" ] && export PATH="$node_bin:$PATH"
                done
                export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"
                bench build --production
              fi

              # bench build writes generated dist files under app public paths in this container.
              # Re-copy after build so generated assets land on the shared sites PVC.
              find sites/assets -maxdepth 1 -type l -delete 2>/dev/null || true
              for app in frappe erpnext healthcare hrms payments mma_design prime; do
                SRC="/home/frappe/frappe-bench/apps/$app/$app/public"
                DST="sites/assets/$app"
                if [ -d "$SRC" ]; then
                  mkdir -p "$DST"
                  cp -rf "$SRC"/. "$DST"/ || true
                fi
              done
              # Build runs in job container FS; materialize symlinked outputs into PVC-backed files.
              TMP_ASSETS_POST=/tmp/materialized-assets-postbuild
              rm -rf "$TMP_ASSETS_POST"
              mkdir -p "$TMP_ASSETS_POST"
              cp -rL sites/assets/. "$TMP_ASSETS_POST"/ 2>/dev/null || true
              find sites/assets -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -rf "$TMP_ASSETS_POST"/. sites/assets/ || true

              if [ ! -s sites/assets/assets.json ] || ! /home/frappe/frappe-bench/env/bin/python3 -c "import json,sys; d=json.load(open('sites/assets/assets.json')); sys.exit(0 if isinstance(d, dict) and len(d) > 0 else 1)"; then
                if [ -s "$BUILT/assets.json" ] && ! grep -Eq '^[[:space:]]*\{[[:space:]]*\}[[:space:]]*$' "$BUILT/assets.json"; then
                  echo "Restoring assets.json from .built-assets"
                  cp -f "$BUILT/assets.json" sites/assets/assets.json
                fi
              fi

              /home/frappe/frappe-bench/env/bin/python3 - <<'PY'
              import json
              import os
              import re

              assets_root = "/home/frappe/frappe-bench/sites/assets"
              assets_json = os.path.join(assets_root, "assets.json")

              def load_json(path):
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception:
                      return {}

              current = load_json(assets_json)
              required_keys = (
                  "app.bundle.js",
                  "app.bundle.css",
                  "libs.bundle.js",
                  "desk.bundle.js",
                  "list.bundle.js",
                  "form.bundle.js",
                  "controls.bundle.js",
                  "report.bundle.js",
                  "erpnext.bundle.css",
                  "hrms.bundle.css",
              )
              def file_exists_for_web_path(p):
                  if not isinstance(p, str) or not p.startswith("/assets/"):
                      return False
                  disk_path = os.path.join("/home/frappe/frappe-bench/sites", p.lstrip("/"))
                  return os.path.exists(disk_path)
              invalid = (
                  not isinstance(current, dict)
                  or len(current) == 0
                  or any((not isinstance(v, str) or not v.startswith("/assets/")) for v in current.values())
                  or any((not file_exists_for_web_path(v)) for v in current.values())
                  or any((k not in current) for k in required_keys)
              )

              if invalid:
                  built = {}
                  hash_bundle_re = re.compile(r"^(?P<name>.+)\.bundle\.[A-Za-z0-9]+\.(?P<ext>js|css)$")

                  for root, _, files in os.walk(assets_root, followlinks=True):
                      rel_root = os.path.relpath(root, assets_root)
                      rel_root = "" if rel_root == "." else rel_root.replace("\\", "/")
                      for fn in sorted(files):
                          rel = f"{rel_root}/{fn}" if rel_root else fn
                          rel = rel.replace("\\", "/")
                          web_path = f"/assets/{rel}"

                          m = hash_bundle_re.match(fn)
                          if m:
                              key = f"{m.group('name')}.bundle.{m.group('ext')}"
                              built.setdefault(key, web_path)

                              if m.group("name") == "desk":
                                  if m.group("ext") == "js":
                                      built["app.bundle.js"] = web_path
                                  elif m.group("ext") == "css":
                                      built["app.bundle.css"] = web_path

                          if fn.endswith(".min.js") or fn.endswith(".min.css"):
                              built.setdefault(fn, web_path)

                  if built:
                      with open(assets_json, "w", encoding="utf-8") as f:
                          json.dump(built, f, separators=(",", ":"), sort_keys=True)
                      print(f"Generated assets.json with {len(built)} entries")
                  else:
                      print("WARN: Could not synthesize assets.json from sites/assets")
              PY

              if [ ! -s sites/assets/assets.json ] || ! /home/frappe/frappe-bench/env/bin/python3 -c "import json,os,sys; d=json.load(open('sites/assets/assets.json')); req=('app.bundle.js','app.bundle.css','libs.bundle.js','desk.bundle.js','list.bundle.js','form.bundle.js','controls.bundle.js','report.bundle.js'); ok=isinstance(d,dict) and all(k in d for k in req) and all(isinstance(v,str) and v.startswith('/assets/') and os.path.exists('/home/frappe/frappe-bench/sites/'+v.lstrip('/')) for v in d.values()); sys.exit(0 if ok else 1)"; then
                echo "ERROR: assets.json is missing/empty after recovery; failing configure job"
                exit 1
              fi

              echo "Assets setup done"
              echo "========================================"
              echo "Configure job finished"
              echo "========================================"
          {{- end }}
          env:
            - name: DB_HOST
              {{- if .Values.mariadb.enabled }}
              {{- if eq .Values.mariadb.architecture "replication" }}
              value: {{ .Release.Name }}-mariadb-primary
              {{- else }}
              value: {{ .Release.Name }}-mariadb
              {{- end }}
              {{- else }}
              value: {{ .Values.dbHost }}
              {{- end }}
            - name: DB_PORT
              value: {{ .Values.mariadb.primary.service.ports.mysql | quote }}
            - name: REDIS_CACHE
              {{- if index .Values "redis-cache" "enabled" }}
              value: redis://{{ .Release.Name }}-redis-cache-master:{{ index .Values "redis-cache" "master" "containerPorts" "redis" }}
              {{- else }}
              value: {{ index .Values "redis-cache" "host" }}
              {{- end }}
            - name: REDIS_QUEUE
              {{- if index .Values "redis-queue" "enabled" }}
              value: redis://{{ .Release.Name }}-redis-queue-master:{{ index .Values "redis-queue" "master" "containerPorts" "redis" }}
              {{- else }}
              value: {{ index .Values "redis-queue" "host" }}
              {{- end }}
            - name: REDIS_SOCKETIO
              {{- if index .Values "redis-socketio" "enabled" }}
              value: redis://{{ .Release.Name }}-redis-socketio-master:{{ index .Values "redis-socketio" "master" "containerPorts" "redis" }}
              {{- else }}
              value: {{ index .Values "redis-socketio" "host" }}
              {{- end }}
            {{- if .Values.jobs.configure.envVars }}
              {{- toYaml .Values.jobs.configure.envVars | nindent 14 }}
            {{- end }}
            - name: SOCKETIO_PORT
              value: {{ .Values.socketio.service.port | quote }}
          resources:
            {{- toYaml .Values.jobs.configure.resources | nindent 12 }}
          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      restartPolicy: Never
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}-logs
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.jobs.configure.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.configure.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.configure.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
