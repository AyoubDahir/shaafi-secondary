apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erpnext.fullname" . }}-gunicorn
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.gunicorn.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "erpnext.name" . }}-gunicorn
      app.kubernetes.io/instance: {{ .Release.Name }}-gunicorn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "erpnext.name" . }}-gunicorn
        app.kubernetes.io/instance: {{ .Release.Name }}-gunicorn
      {{- if .Values.forceRedeploy }}
      annotations:
        forceRedeploy: {{ .Values.forceRedeploy | quote }}
      {{- end }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "erpnext.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: populate-assets
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "-c"]
          args:
            - |
              ASSETS_DIR=/home/frappe/frappe-bench/sites/assets
              BUILT=/home/frappe/frappe-bench/.built-assets
              CONFIG=/home/frappe/frappe-bench/sites/common_site_config.json

              # Repair stale literal "\\n" suffix and reset invalid JSON config.
              # This prevents runtime 500s when frappe reads redis_* settings.
              if [ -f "$CONFIG" ]; then
                sed -i 's/\\n$//' "$CONFIG" || true
                if ! jq -e . "$CONFIG" >/dev/null 2>&1; then
                  echo "{}" > "$CONFIG"
                fi
              fi

              # Assets are identical on every pod (same image) and disposable, so
              # they don't need to live on the shared NFS-backed PVC at all. Instead
              # of copying thousands of files on every single pod start/restart
              # (slow, and prone to directory/symlink type conflicts a real merge
              # can hit), just point sites/assets at the image's own pre-built copy.
              if [ ! -d "$BUILT" ] || [ ! -s "$BUILT/assets.json" ]; then
                echo "ERROR: $BUILT missing or assets.json empty/missing; image was not built with assets"
                exit 1
              fi

              rm -rf "$ASSETS_DIR"
              ln -sfn "$BUILT" "$ASSETS_DIR"
              echo "$ASSETS_DIR -> $(readlink -f "$ASSETS_DIR")"

              if ! /home/frappe/frappe-bench/env/bin/python3 -c "import json,os,sys; d=json.load(open('$ASSETS_DIR/assets.json')); req=('app.bundle.js','app.bundle.css','libs.bundle.js','desk.bundle.js','list.bundle.js','form.bundle.js','controls.bundle.js','report.bundle.js'); ok=isinstance(d,dict) and all(k in d for k in req) and all(isinstance(v,str) and v.startswith('/assets/') and os.path.exists('/home/frappe/frappe-bench/sites/'+v.lstrip('/')) for v in d.values()); sys.exit(0 if ok else 1)"; then
                echo "ERROR: assets.json missing required bundle keys after symlink; refusing to start with broken assets"
                exit 1
              fi

              echo "Clearing stale assets cache from Redis..."
              /home/frappe/frappe-bench/env/bin/python3 -c "
              import json, redis
              try:
                  cfg = json.load(open('/home/frappe/frappe-bench/sites/common_site_config.json'))
                  r = redis.Redis.from_url(cfg.get('redis_cache', ''))
                  cleared = 0
                  for k in r.keys('*assets_json*'):
                      r.delete(k)
                      cleared += 1
                  print('Cleared %d stale assets cache keys' % cleared)
              except Exception as e:
                  print('Cache clear skipped: %s' % e)
              " || echo "Redis flush skipped"
          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites
      {{- if .Values.worker.gunicorn.initContainers }}
        {{- toYaml .Values.worker.gunicorn.initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: gunicorn
          env:
            - name: SITES_PATH
              value: /home/frappe/frappe-bench/sites
            - name: DEFAULT_SITE
              value: {{ .Values.jobs.installApp.siteName | quote }}
            {{- if .Values.worker.gunicorn.envVars }}
            {{- toYaml .Values.worker.gunicorn.envVars | nindent 12 }}
            {{- end }}
          {{- $siteName := .Values.jobs.installApp.siteName }}
          {{- if .Values.worker.gunicorn.increaseFileLimit }}
          command: ["/bin/bash", "-c"]
          args:
            - "ln -sfn /home/frappe/frappe-bench/sites/{{ $siteName }} /home/frappe/frappe-bench/{{ $siteName }} 2>/dev/null; rm -rf /home/frappe/frappe-bench/assets; ln -s /home/frappe/frappe-bench/sites/assets /home/frappe/frappe-bench/assets 2>/dev/null; cd /home/frappe/frappe-bench && ulimit -n 65536 && exec {{ join " " .Values.worker.gunicorn.args }}"
          {{- else }}
          command: ["/bin/bash", "-c"]
          args:
            - "ln -sfn /home/frappe/frappe-bench/sites/{{ $siteName }} /home/frappe/frappe-bench/{{ $siteName }} 2>/dev/null; rm -rf /home/frappe/frappe-bench/assets; ln -s /home/frappe/frappe-bench/sites/assets /home/frappe/frappe-bench/assets 2>/dev/null; cd /home/frappe/frappe-bench && exec {{ join " " .Values.worker.gunicorn.args }}"
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
          - name: logs
            mountPath: /home/frappe/logs
          ports:
            - name: http
              containerPort: {{ .Values.worker.gunicorn.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.worker.gunicorn.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.gunicorn.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.gunicorn.resources | nindent 12 }}
      {{- if .Values.worker.gunicorn.sidecars }}
        {{- toYaml .Values.worker.gunicorn.sidecars | nindent 8 }}
      {{- end }}
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}-logs
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.worker.gunicorn.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.worker.gunicorn.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.worker.gunicorn.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
