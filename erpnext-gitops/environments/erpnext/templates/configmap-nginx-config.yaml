{{- if or .Values.nginx.config .Values.nginx.configFile }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "erpnext.fullname" . }}-nginx-config
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
data:
  default.conf: {{ if .Values.nginx.configFile }}{{ include "nginx-frappe-catchall.conf" . | quote }}{{ else }}{{ .Values.nginx.config | quote }}{{ end }}
{{- end }}
