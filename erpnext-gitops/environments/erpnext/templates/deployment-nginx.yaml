apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erpnext.fullname" . }}-nginx
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "erpnext.name" . }}-nginx
      app.kubernetes.io/instance: {{ .Release.Name }}-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "erpnext.name" . }}-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}-nginx
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "erpnext.serviceAccountName" . }}
      securityContext:
        {{- if .Values.nginx.podSecurityContext }}
        {{- toYaml .Values.nginx.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      initContainers:
        - name: populate-assets
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command: ["bash", "-c"]
          args:
            - |
              # Assets are identical on every pod (same image) and disposable, so
              # they don't need to live on the shared NFS-backed PVC at all. Instead
              # of copying thousands of files on every single pod start/restart
              # (slow, and prone to directory/symlink type conflicts a real merge
              # can hit), just point sites/assets at the image's own pre-built copy.
              ASSETS_DIR=/home/frappe/frappe-bench/sites/assets
              BUILT=/home/frappe/frappe-bench/.built-assets

              if [ ! -d "$BUILT" ] || [ ! -s "$BUILT/assets.json" ]; then
                echo "ERROR: $BUILT missing or assets.json empty/missing; image was not built with assets"
                exit 1
              fi

              rm -rf "$ASSETS_DIR"
              ln -sfn "$BUILT" "$ASSETS_DIR"
              echo "$ASSETS_DIR -> $(readlink -f "$ASSETS_DIR")"

              if ! /home/frappe/frappe-bench/env/bin/python3 -c "import json,os,sys; d=json.load(open('$ASSETS_DIR/assets.json')); req=('app.bundle.js','app.bundle.css','libs.bundle.js','desk.bundle.js','list.bundle.js','form.bundle.js','controls.bundle.js','report.bundle.js'); ok=isinstance(d,dict) and all(k in d for k in req) and all(isinstance(v,str) and v.startswith('/assets/') and os.path.exists('/home/frappe/frappe-bench/sites/'+v.lstrip('/')) for v in d.values()); sys.exit(0 if ok else 1)"; then
                echo "ERROR: assets.json missing required bundle keys after symlink; refusing to start with broken assets"
                exit 1
              fi
          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites
      {{- if .Values.nginx.initContainers }}
        {{- toYaml .Values.nginx.initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          args:
          {{- if or .Values.nginx.config .Values.nginx.configFile }}
          - nginx
          - -g
          - 'daemon off;'
          {{- else }}
          - nginx-entrypoint.sh
          {{- end }}
          env:
            - name: "BACKEND"
              value: {{ print (include "erpnext.fullname" .) "-gunicorn:" .Values.worker.gunicorn.service.port }}
            - name: "SOCKETIO"
              value: {{ print (include "erpnext.fullname" .) "-socketio:" .Values.socketio.service.port }}
            - name: "UPSTREAM_REAL_IP_ADDRESS"
              value: {{ .Values.nginx.environment.upstreamRealIPAddress | quote }}
            - name: "UPSTREAM_REAL_IP_RECURSIVE"
              value: {{ .Values.nginx.environment.upstreamRealIPRecursive | quote }}
            - name: "UPSTREAM_REAL_IP_HEADER"
              value: {{ .Values.nginx.environment.upstreamRealIPHeader }}
            - name: "FRAPPE_SITE_NAME_HEADER"
              value: {{ .Values.nginx.environment.frappeSiteNameHeader }}
          {{- if .Values.nginx.envVars }}
            {{- toYaml .Values.nginx.envVars | nindent 12 }}
          {{- end }}
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.nginx.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.nginx.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          securityContext:
            {{- if .Values.nginx.containerSecurityContext }}
            {{- toYaml .Values.nginx.containerSecurityContext | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          {{- if or .Values.nginx.config .Values.nginx.configFile }}
          - name: nginx-config
            mountPath: /etc/nginx/conf.d
          {{- end }}
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if or .Values.nginx.config .Values.nginx.configFile }}
        - name: nginx-config
          configMap:
            name: {{ include "erpnext.fullname" . }}-nginx-config
        {{- end }}
      {{- with .Values.nginx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.nginx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.nginx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
