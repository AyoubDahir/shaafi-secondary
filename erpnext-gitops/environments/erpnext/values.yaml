forceRedeploy: "1"
image:
  repository: ghcr.io/ayoubdahir/shaafi-custom
  # Pinned to a known-good production tag — this repo has no build pipeline of its
  # own (see README/git history: erpnext-build + .github were dropped on purpose,
  # reusing the same image family the production repo already builds and publishes).
  # 2026-09-03: rebuilt from apps.json pointed at real production app commits
  # (Ayuubi/* mirrors of the Rasiintech source repos) instead of juuja-ali's
  # stale/unpinned ones -- see shaafi commit e9d50dbd. Excludes
  # hospital_queue_display (source repo access not yet available).
  tag: e9d50dbd654519cced17d31eb300160efe0a0cf8
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
serviceAccount:
  create: true
  name: ""
podSecurityContext: {}
securityContext: {}
persistence:
  worker:
    enabled: true
    existingClaim: "erpnext-pvc"
  logs:
    enabled: true
    existingClaim: "erpnext-logs-pvc"
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "shaafi-secondary.108-181-202-157.sslip.io"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
# dbHost: read by the chart's job templates when mariadb.enabled is false (it stays
# false here too — Galera is deployed as its own separate Application,
# apps/mariadb-galera.yaml, not via this chart's bundled standalone mariadb subchart).
# VERIFY: exact in-cluster service DNS name once mariadb-galera has synced at least
# once (kubectl get svc -n erpnext) — this assumes ArgoCD's default release-name
# behavior (Helm release name == Application name == "mariadb-galera").
dbHost: "mariadb-galera.erpnext.svc.cluster.local"
jobs:
  migrate:
    enabled: true
    backoffLimit: 1
    siteName: "shaafi"
    skipFailing: false
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
  volumePermissions:
    # First-sync-only: chowns fresh Longhorn volumes to the frappe uid. Confirmed via
    # job logs and 22+ days of stable uptime since — flipped off 2026-08-15.
    enabled: false
    backoffLimit: 0
  configure:
    enabled: true
    backoffLimit: 2
    fixVolume: false
    resources: {}
    companySetup:
      enabled: false
  createSite:
    # First-bootstrap-only, same lifecycle prod's own git history already shows for
    # this job: enabled true to create the fresh empty site, then flip back to false.
    #
    # RE-ENABLED-then-DISABLED 2026-08-23: the "serving traffic for 22+ days" claim
    # above was never actually verified over HTTP — it turned out false. The site's
    # MySQL database never existed at all (wrong MariaDB charset -- see
    # apps/mariadb-galera.yaml -- silently failed every bench new-site attempt since
    # 2026-07-23) and a separate Galera/MyISAM engine-mismatch bug (see
    # job-create-site.yaml's __global_search InnoDB-conversion watcher) blocked it
    # again after the charset was fixed. Both fixed same-session; forceCreate: true
    # successfully recreated the site. Flipping enabled/forceCreate back to false now
    # that it's confirmed working -- don't flip true again without a real reason, a
    # forced re-run wipes and recreates the live site from scratch.
    enabled: false
    backoffLimit: 5
    siteName: shaafi
    dbType: mariadb
    # Same chart limitation as dbRootPassword above — no secret-ref option exists for
    # this field, it's read as plaintext from values.yaml by job-create-site.yaml.
    # Accepted only because this repo is private. Rotate via `bench --site shaafi
    # set-admin-password` after first login if this needs to change.
    adminPassword: "YmIQHWkFYnJpSG38f4Gr"
    forceCreate: false
    installApps:
      - erpnext
    defaultTheme: ""
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
  installApp:
    # First-bootstrap-only, same lifecycle as createSite above. Flipped off
    # 2026-08-15 — apps are already installed; job-configure-bench.yaml's own
    # idempotent install-app loop (keyed off .apps below) remains as the ongoing
    # safety net, so the .apps list here must stay populated even though this
    # standalone PostSync job is now disabled.
    enabled: false
    siteName: "shaafi"
    apps:
      - healthcare
      - hrms
      - his
      - chat
      - rasiin_hr
      - rasiin_design
      - shaafi_mobile_app
      - dfp_external_storage
    defaultTheme: ""
    backoffLimit: 2
    ttlSecondsAfterFinished: 300
    resources: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
  setupWebsite:
    enabled: false
    siteName: "shaafi"
    backoffLimit: 2
    resources: {}
    nodeSelector: {}
    tolerations: []
  grantSiteDbUser:
    # DISABLED 2026-08-23: this job has no ArgoCD hook/sync-wave ordering relative to
    # createSite, and its own internal retry loop (waiting for the DB to exist) blocks
    # the whole sync from ever reaching createSite -- which is what would actually
    # create that DB. RE-ENABLED 2026-08-23: createSite confirmed succeeded (real DB +
    # apps installed), safe to run now -- idempotent password-sync against a DB that
    # actually exists. Flip back to false once confirmed via job logs, same lifecycle.
    enabled: true
    backoffLimit: 5
    resources: {}
  dropSite:
    enabled: false
    backoffLimit: 0
    siteName: ""
    forced: false
  backup:
    enabled: false
    backoffLimit: 0
    siteName: ""
    withFiles: true
  scheduledBackup:
    enabled: true
    schedule: "0 */6 * * *"
    siteName: "shaafi"
    withFiles: true
    retentionDays: 14
    backupVolume:
      existingClaim: "erpnext-backup-pvc"
    nodeSelector: {}
    tolerations: []
  custom:
    enabled: false
nginx:
  replicaCount: 2
  autoscaling:
    enabled: false
  configFile: "nginx-frappe.conf"
  service:
    type: ClusterIP
    port: 8080
  environment:
    upstreamRealIPAddress: "127.0.0.1"
    upstreamRealIPRecursive: "off"
    upstreamRealIPHeader: "X-Forwarded-For"
    frappeSiteNameHeader: "shaafi"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  containerSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi
  # No nodeSelector — this is exactly what the secondary cluster exists to eliminate.
  # "Preferred" (not "required") anti-affinity: with only 2 app-tier nodes today, a
  # hard rule would still be fine at replicaCount 2 (1-per-node is satisfiable), but
  # kept preferred/uniform across all app tiers for consistency with the 3-replica
  # tiers below, where a hard rule would leave the 3rd pod permanently Pending.
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-nginx
socketio:
  replicaCount: 2
  autoscaling:
    enabled: false
  service:
    type: ClusterIP
    port: 9000
  livenessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 320Mi
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-socketio
worker:
  gunicorn:
    # Bumped 2 -> 3 to match the target architecture (PROJECT_PLANNING.md: gunicorn=3).
    replicaCount: 3
    autoscaling:
      enabled: false
    increaseFileLimit: true
    args:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --bind=0.0.0.0:8000
      - --timeout=120
      - --workers=2
      - --preload
      - frappe.app:application
    livenessProbe:
      tcpSocket:
        port: 8000
    readinessProbe:
      tcpSocket:
        port: 8000
    service:
      type: ClusterIP
      port: 8000
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 800m
        memory: 1024Mi
    nodeSelector: {}
    tolerations: []
    # Must stay "preferred": replicaCount 3 across only 2 app-tier nodes means a hard
    # rule would leave the 3rd replica permanently Pending (no 3rd node to satisfy
    # strict one-pod-per-node exclusivity). This upgrades naturally to a real 3-way
    # spread once/if a 3rd app-tier-capable node ever exists.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: erpnext-gunicorn
  default:
    # Bumped 2 -> 3 to match the target architecture (PROJECT_PLANNING.md: workers=3).
    replicaCount: 3
    autoscaling:
      enabled: false
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: erpnext-worker-d
  short:
    replicaCount: 3
    autoscaling:
      enabled: false
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    resources:
      requests:
        cpu: 75m
        memory: 192Mi
      limits:
        cpu: 400m
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: erpnext-worker-s
  long:
    replicaCount: 3
    autoscaling:
      enabled: false
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    resources:
      requests:
        cpu: 75m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 896Mi
    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: erpnext-worker-l
  scheduler:
    # Singleton by design — ERPNext's scheduler can't run concurrently. No affinity:
    # let it float freely to whichever node is healthy.
    replicaCount: 1
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 250m
        memory: 384Mi
  healthProbe: |
    exec:
      command:
        - bash
        - -c
        - echo "Ping backing services";
    initialDelaySeconds: 15
    periodSeconds: 5
keda:
  enabled: false
# Redis: disabled here, deployed instead as 3 independent HA Applications
# (apps/redis-cache-ha.yaml, apps/redis-queue-ha.yaml, apps/redis-socketio-ha.yaml —
# master/replica + Sentinel each) plus apps/redis-sentinel-arbiter.yaml for the 3rd
# vote. The chart's bundled redis subchart has no Sentinel support, so it can't be
# used for this.
#
# CONFIRMED (read job-configure-bench.yaml directly): when redis-cache.enabled is
# false, the chart reads `redis-cache.host` verbatim as the connection string (NOT
# just a hostname — must be the full "redis://host:port" value, same shape as the
# enabled branch produces). Without this key the configure job's REDIS_CACHE env
# would render empty and break site bootstrap — this was a real gap in the first
# draft, now fixed.
#
# CORRECTED live: originally guessed a "<release>-master" service name, which
# doesn't exist — bitnami's redis chart docs state sentinel.enabled=true "disable[s]
# the master and replicas services and create[s] a single Redis service" instead
# (confirmed via `kubectl get svc -n erpnext`: only `<release>` and
# `<release>-headless` exist). The plain <release> Service has no role-based selector
# (bitnami's sentinel-mode chart doesn't label pods by role) so it round-robins across
# BOTH the master and the replica — Frappe/RQ hold long-lived connections with no
# Sentinel awareness, so ~half of new connections landed on the read-only replica and
# threw `redis.exceptions.ReadOnlyError` (root cause of a 30-day outage, 2026-08-23).
# A hardcoded per-pod headless DNS was used as a stopgap after that, but doesn't
# survive a real failover — hit twice (2026-08-29, 2026-08-30), each requiring a
# manual GitOps repoint while every worker pod crash-looped in the meantime.
#
# PERMANENT FIX 2026-08-30: apps/redis-master-tracker.yaml deploys a small
# reconciler (system/redis-master-tracker/) that polls each group's Sentinel every
# 15s and keeps a dedicated `redis-<role>-ha-master` ExternalName Service pointed at
# whichever pod is actually master. Verified live: deliberately mispointed
# redis-queue-ha-master at the replica and confirmed the tracker corrected it back
# within one poll cycle. All 3 roles now point at these tracker-managed services
# instead of a specific node — a future failover should no longer need a manual fix.
redis-cache:
  enabled: false
  host: "redis://redis-cache-ha-master.erpnext.svc.cluster.local:6379"
redis-queue:
  enabled: false
  host: "redis://redis-queue-ha-master.erpnext.svc.cluster.local:6379"
redis-socketio:
  enabled: false
  host: "redis://redis-socketio-ha-master.erpnext.svc.cluster.local:6379"
postgresql:
  enabled: false
# mariadb.enabled stays false — Galera is deployed independently
# (apps/mariadb-galera.yaml), not via this chart's bundled standalone subchart. See
# dbHost above. BUT `primary.service.ports.mysql` must stay defined regardless: several
# job templates (create-site, configure-bench, grant-site-db-user) read
# `.Values.mariadb.primary.service.ports.mysql` unconditionally as their DB_PORT
# fallback, even when mariadb.enabled is false — removing it (as the first draft of
# this file did) would break those jobs. Set to match the Galera service's port.
mariadb:
  enabled: false
  primary:
    service:
      ports:
        mysql: 3306
# dbRootUser/dbRootPassword: read by job-create-site.yaml and secret.yaml. This is a
# real chart limitation, not a choice — secret.yaml b64-encodes dbRootPassword
# DIRECTLY from this values.yaml field (there's no existingSecret option for it the
# way apps/mariadb-galera.yaml's rootUser.existingSecret has), so this credential
# unavoidably lives in git as plaintext here. Accepted only because this repo is
# private — must match the same root password used to create the mariadb-galera-secret
# Kubernetes Secret (kept OUT of git) that apps/mariadb-galera.yaml's Galera chart
# actually authenticates with. Rotate both together if this ever needs to change.
dbRootUser: "root"
dbRootPassword: "2m84g4Rmhvxkfp6ja1GplzOfXqYWZqvn"
