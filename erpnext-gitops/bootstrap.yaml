apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shaafi-secondary-admin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/AyoubDahir/shaafi-secondary.git'
    targetRevision: HEAD
    path: erpnext-gitops/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
