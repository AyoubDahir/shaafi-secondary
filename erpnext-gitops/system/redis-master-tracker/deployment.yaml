# docker.io/alpine/k8s:1.28.4 confirmed pullable in this cluster and confirmed
# `apk add --no-cache redis` works (2026-08-30 live test) -- gives both kubectl
# (already in the base image) and redis-cli (installed at container start) in
# one container, avoiding a custom image build/push for something this small.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master-tracker
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-master-tracker
  template:
    metadata:
      labels:
        app: redis-master-tracker
    spec:
      serviceAccountName: redis-master-tracker
      containers:
        - name: tracker
          image: docker.io/alpine/k8s:1.28.4
          command:
            - sh
            - -c
            - "apk add --no-cache redis >/dev/null 2>&1; exec sh /scripts/tracker.sh"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      volumes:
        - name: script
          configMap:
            name: redis-master-tracker-script
