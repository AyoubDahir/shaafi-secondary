# The 3rd, data-less Galera vote — no PersistentVolume, floats to whichever node k8s
# schedules it on (no anti-affinity requirement since it doesn't compete with the 2
# real data nodes for a "one per node" guarantee).
#
# VERIFY BEFORE FIRST SYNC:
# - image below assumes it was built from ./Dockerfile in this same directory and
#   pushed to ghcr.io/ayoubdahir/shaafi-garbd:1.0 — build+push is a manual step,
#   not automated by any workflow in this repo (mirrors the decision in §1 of the
#   plan to not stand up a second CI pipeline for infra-only images).
# - --address values: bitnami's mariadb-galera chart creates a headless Service
#   for direct pod DNS; confirm the actual per-pod hostnames after the
#   mariadb-galera Application's first sync (kubectl get pods,svc -n erpnext) and
#   correct the two addresses below if they differ from this guess.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garbd
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garbd
  template:
    metadata:
      labels:
        app: garbd
    spec:
      containers:
        - name: garbd
          image: ghcr.io/ayoubdahir/shaafi-garbd:1.0
          args:
            - "--group=shaafi-secondary-galera"
            - "--address=gcomm://mariadb-galera-0.mariadb-galera-headless.erpnext.svc.cluster.local:4567,mariadb-galera-1.mariadb-galera-headless.erpnext.svc.cluster.local:4567"
            - "--donor=mariadb-galera-0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
