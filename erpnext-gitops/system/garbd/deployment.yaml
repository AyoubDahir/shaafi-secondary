# The 3rd, data-less Galera vote — no PersistentVolume. Pinned to the VPS quorum node
# (shaafi-vpc, labeled+tainted workload-tier=quorum once it joined the cluster
# 2026-08-23) via nodeSelector/tolerations below, per the locked-in architecture
# ("never a full MariaDB node on the VPS, garbd only").
#
# VERIFY BEFORE FIRST SYNC:
# - image below assumes it was built from ./Dockerfile in this same directory and
#   pushed to ghcr.io/ayoubdahir/shaafi-garbd:1.0 — build+push is a manual step,
#   not automated by any workflow in this repo (mirrors the decision in §1 of the
#   plan to not stand up a second CI pipeline for infra-only images).
# - --address values CONFIRMED 2026-08-23 correct against the live mariadb-galera-0/1
#   pods and the mariadb-galera-headless Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garbd
  namespace: erpnext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garbd
  template:
    metadata:
      labels:
        app: garbd
    spec:
      nodeSelector:
        workload-tier: quorum
      tolerations:
        - key: workload-tier
          operator: Equal
          value: quorum
          effect: NoSchedule
      containers:
        - name: garbd
          image: ghcr.io/ayoubdahir/shaafi-garbd:1.0
          args:
            - "--group=shaafi-secondary-galera"
            - "--address=gcomm://mariadb-galera-0.mariadb-galera-headless.erpnext.svc.cluster.local:4567,mariadb-galera-1.mariadb-galera-headless.erpnext.svc.cluster.local:4567"
            - "--donor=mariadb-galera-0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
