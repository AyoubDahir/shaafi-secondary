# Real Galera cluster for the secondary site: 2 data nodes (ShaafiControl1 +
# shaaficontrol2, hard-anti-affinity so they always land one-per-node) + a separate
# garbd Application (apps/garbd.yaml) acting as the 3rd, data-less vote so the cluster
# has real odd-numbered quorum today instead of waiting for the VPS. When the VPS
# joins later, garbd relocates there and this stays a straight 2-data-node cluster.
#
# VENDORED, not sourced live from OCI (2026-07-23): ArgoCD v3.4.5's OCI tag/digest
# resolution persistently 401s against Docker Hub's anonymous bearer-token flow — a
# confirmed ArgoCD-internal bug, not a real auth/network issue (`helm pull` from
# inside the argocd-repo-server pod succeeds every time; ArgoCD's own separate
# revision-resolution check fails every time, tag or digest, regardless of repository
# registration). Tried: hard-refresh, restarting repo-server and
# application-controller, deleting+recreating the Application, registering an
# anonymous Repository Secret (host-only and host+path forms), pinning to a resolved
# digest instead of a tag — none of it worked. Workaround: the chart (version 16.0.1,
# `helm pull oci://registry-1.docker.io/bitnamicharts/mariadb-galera --version
# 16.0.1 --untar`) is vendored directly into this repo at
# system/mariadb-galera-chart/ — it already bundled its own `common` library
# dependency inside the package (charts/common/), so this is fully self-contained:
# no OCI, no HTTP, no runtime chart-repo dependency of any kind at sync time. Same
# pattern the erpnext chart itself already uses (a committed local chart tree).
#
# Other things CONFIRMED against the real chart (not guessed) while first setting
# this up:
# - Password wiring is a single TOP-LEVEL `existingSecret` (not `rootUser.existingSecret`
#   as first guessed), and the secret must contain exactly the keys
#   mariadb-root-password / mariadb-galera-mariabackup-password / mariadb-password.
# - The chart's own default image (docker.io/bitnami/mariadb-galera:12.0.2-debian-12-r0)
#   returns 404 on Docker Hub — Broadcom now gates current Bitnami images behind a
#   paid tier. The free mirror is docker.io/bitnamilegacy/mariadb-galera, confirmed to
#   have this exact tag still published.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-galera
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/AyoubDahir/shaafi-secondary.git
    targetRevision: HEAD
    path: erpnext-gitops/system/mariadb-galera-chart
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/mariadb-galera
          tag: 12.0.2-debian-12-r0
        # ADDED 2026-08-23: the chart's default mariadbConfiguration sets legacy
        # utf8/utf8_unicode_ci (utf8mb3) — confirmed via a failed `bench new-site`:
        # "Database settings do not match expected values" (Frappe requires utf8mb4).
        # This is why the site's database has never actually existed since the site
        # directory was first created 2026-07-23 — create-site has always failed at
        # the DB-provisioning step. Identical to the chart's own default (see
        # system/mariadb-galera-chart/values.yaml) except the 3 charset lines.
        mariadbConfiguration: |-
          [client]
          port=3306
          socket=/opt/bitnami/mariadb/tmp/mysql.sock
          plugin_dir=/opt/bitnami/mariadb/plugin

          [mysqld]
          explicit_defaults_for_timestamp
          default_storage_engine=InnoDB
          basedir=/opt/bitnami/mariadb
          datadir=/bitnami/mariadb/data
          plugin_dir=/opt/bitnami/mariadb/plugin
          tmpdir=/opt/bitnami/mariadb/tmp
          socket=/opt/bitnami/mariadb/tmp/mysql.sock
          pid_file=/opt/bitnami/mariadb/tmp/mysqld.pid
          bind_address=0.0.0.0

          ## Character set -- utf8mb4 required by Frappe/ERPNext
          ##
          collation_server=utf8mb4_unicode_ci
          init_connect='SET NAMES utf8mb4'
          character_set_server=utf8mb4

          ## MyISAM
          ##
          key_buffer_size=32M
          myisam_recover_options=FORCE,BACKUP

          ## Safety
          ##
          skip_host_cache
          skip_name_resolve
          max_allowed_packet=16M
          max_connect_errors=1000000
          sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_AUTO_VALUE_ON_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,ONLY_FULL_GROUP_BY
          sysdate_is_now=1

          ## Binary Logging
          ##
          log_bin=mysql-bin
          expire_logs_days=14
          sync_binlog=0
          binlog_format=row

          ## Caches and Limits
          ##
          tmp_table_size=32M
          max_heap_table_size=32M
          query_cache_type=1
          query_cache_limit=4M
          query_cache_size=256M
          max_connections=500
          thread_cache_size=50
          open_files_limit=65535
          table_definition_cache=4096
          table_open_cache=4096

          ## InnoDB
          ##
          innodb=FORCE
          innodb_strict_mode=1
          innodb_autoinc_lock_mode=2
          innodb_doublewrite=1
          innodb_flush_method=O_DIRECT
          innodb_log_files_in_group=2
          innodb_log_file_size=128M
          innodb_flush_log_at_trx_commit=1
          innodb_file_per_table=1
          innodb_buffer_pool_size=1G
          innodb_file_format=Barracuda

          ## Logging
          ##
          log_error=/opt/bitnami/mariadb/logs/mysqld.log
          slow_query_log_file=/opt/bitnami/mariadb/logs/mysqld.log
          log_queries_not_using_indexes=1
          slow_query_log=1

          [galera]
          wsrep_on=ON
          wsrep_provider=/opt/bitnami/mariadb/lib/libgalera_smm.so
          wsrep_sst_method=mariabackup
          wsrep_slave_threads=4
          wsrep_cluster_address=gcomm://
          wsrep_cluster_name=galera
          wsrep_sst_auth="root:"
          innodb_flush_log_at_trx_commit=2
          wsrep_mode=REPLICATE_MYISAM

          [mariadb]
          plugin_load_add=auth_pam
        replicaCount: 2
        podAntiAffinityPreset: hard
        existingSecret: mariadb-galera-secret
        galera:
          name: shaafi-secondary-galera
          # TEMPORARY, 2026-09-01: cluster lost quorum (both nodes down together,
          # likely from the shaaficontrol1 network incident during on-prem VPN setup
          # the day before) and mariadb-galera-0 refused to self-bootstrap
          # (safe_to_bootstrap: 0 in grastate.dat -- Galera's split-brain safety
          # brake). mariadb-galera-1 never existed as a pod (StatefulSet OrderedReady
          # never got past ordinal 0), so -0 is the only copy of the data and there's
          # no ambiguity about which node to trust. Forces bootstrap from node 0 via
          # the chart's official mechanism (MARIADB_GALERA_CLUSTER_BOOTSTRAP /
          # MARIADB_GALERA_FORCE_SAFETOBOOTSTRAP env vars -- see
          # system/mariadb-galera-chart/templates/statefulset.yaml). MUST be reverted
          # (set forceBootstrap/forceSafeToBootstrap back to false, or delete this
          # block) in a follow-up commit once the cluster is confirmed healthy --
          # leaving this on defeats Galera's split-brain protection for any future
          # incident.
          bootstrap:
            forceBootstrap: true
            bootstrapFromNode: 0
            forceSafeToBootstrap: true
        persistence:
          enabled: true
          storageClass: longhorn-nvme
          size: 20Gi
        service:
          ports:
            mysql: 3306
        containerPorts:
          mysql: 3306
          galera: 4567
          ist: 4568
          sst: 4444
  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
