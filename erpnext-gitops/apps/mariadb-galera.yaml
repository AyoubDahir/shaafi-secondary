# Real Galera cluster for the secondary site: 2 data nodes (ShaafiControl1 +
# shaaficontrol2, hard-anti-affinity so they always land one-per-node) + a separate
# garbd Application (apps/garbd.yaml) acting as the 3rd, data-less vote so the cluster
# has real odd-numbered quorum today instead of waiting for the VPS. When the VPS
# joins later, garbd relocates there and this stays a straight 2-data-node cluster.
#
# VENDORED, not sourced live from OCI (2026-07-23): ArgoCD v3.4.5's OCI tag/digest
# resolution persistently 401s against Docker Hub's anonymous bearer-token flow — a
# confirmed ArgoCD-internal bug, not a real auth/network issue (`helm pull` from
# inside the argocd-repo-server pod succeeds every time; ArgoCD's own separate
# revision-resolution check fails every time, tag or digest, regardless of repository
# registration). Tried: hard-refresh, restarting repo-server and
# application-controller, deleting+recreating the Application, registering an
# anonymous Repository Secret (host-only and host+path forms), pinning to a resolved
# digest instead of a tag — none of it worked. Workaround: the chart (version 16.0.1,
# `helm pull oci://registry-1.docker.io/bitnamicharts/mariadb-galera --version
# 16.0.1 --untar`) is vendored directly into this repo at
# system/mariadb-galera-chart/ — it already bundled its own `common` library
# dependency inside the package (charts/common/), so this is fully self-contained:
# no OCI, no HTTP, no runtime chart-repo dependency of any kind at sync time. Same
# pattern the erpnext chart itself already uses (a committed local chart tree).
#
# Other things CONFIRMED against the real chart (not guessed) while first setting
# this up:
# - Password wiring is a single TOP-LEVEL `existingSecret` (not `rootUser.existingSecret`
#   as first guessed), and the secret must contain exactly the keys
#   mariadb-root-password / mariadb-galera-mariabackup-password / mariadb-password.
# - The chart's own default image (docker.io/bitnami/mariadb-galera:12.0.2-debian-12-r0)
#   returns 404 on Docker Hub — Broadcom now gates current Bitnami images behind a
#   paid tier. The free mirror is docker.io/bitnamilegacy/mariadb-galera, confirmed to
#   have this exact tag still published.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-galera
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/AyoubDahir/shaafi-secondary.git
    targetRevision: HEAD
    path: erpnext-gitops/system/mariadb-galera-chart
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/mariadb-galera
          tag: 12.0.2-debian-12-r0
        replicaCount: 2
        podAntiAffinityPreset: hard
        existingSecret: mariadb-galera-secret
        galera:
          name: shaafi-secondary-galera
        persistence:
          enabled: true
          storageClass: longhorn-nvme
          size: 20Gi
        service:
          ports:
            mysql: 3306
        containerPorts:
          mysql: 3306
          galera: 4567
          ist: 4568
          sst: 4444
  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
