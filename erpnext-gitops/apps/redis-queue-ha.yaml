# Replaces the erpnext chart's bundled `redis-queue` subchart (now redis-queue.enabled:
# false in values.yaml) with a standalone master/replica + Sentinel deployment, since
# the chart's own bundled redis subcharts don't support Sentinel. Same pattern
# repeated for redis-queue-ha.yaml / redis-socketio-ha.yaml — one per ERPNext redis
# role, each an independent master/replica pair (not one shared Redis for all three,
# matching how the live prod repo already keeps them as 3 separate instances).
#
# CONFIRMED against the real chart (`helm show values bitnami/redis --version
# 17.3.17`), not guessed, after the first-draft assumptions turned out wrong:
# - There is NO top-level `replicaCount` field in this chart version at all (it was
#   silently ignored as an unknown key) — the field that actually controls total node
#   count once sentinel.enabled=true is `replica.replicaCount` (chart doc: "this will
#   disable the master and replicas services and create a single Redis service").
#   First draft left this at 1, so only a single node+sentinel pod ever ran.
# - Because sentinel mode collapses to one combined service, there is NO
#   `<release>-master` service — only `<release>` (plain) and `<release>-headless`.
#   Every place this repo referenced a "-master" hostname (values.yaml's
#   redis-*.host fields, the sentinel-arbiter's sentinel.conf ConfigMap) was wrong
#   and has been corrected to the plain service name.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-queue-ha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 17.3.17
    helm:
      values: |
        architecture: replication
        auth:
          enabled: false
        image:
          registry: docker.io
          repository: bitnamilegacy/redis
          tag: 7.0.7-debian-11-r0
        replica:
          replicaCount: 2
          containerPorts:
            redis: 6379
          persistence:
            storageClass: longhorn-nvme
            size: 5Gi
          podAntiAffinityPreset: hard
        sentinel:
          enabled: true
          quorum: 2
          containerPort: 26379
          # CONFIRMED live: the chart pulls a SEPARATE image for the sentinel sidecar
          # (sentinel.image, distinct from the top-level image.* override above) —
          # missed on the first pass, causing ImagePullBackOff on the chart's own
          # default (docker.io/bitnami/redis-sentinel:7.0.6-debian-11-r1, which 404s
          # post-Broadcom-paywall same as the other bitnami/* images in this repo).
          # bitnamilegacy has this exact tag published.
          image:
            registry: docker.io
            repository: bitnamilegacy/redis-sentinel
            tag: 7.0.6-debian-11-r1
  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
